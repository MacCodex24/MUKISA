<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — Mac Applic</title>
  <link rel="stylesheet" href="../mac.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <div class="login-wrapper">
    <div class="login-card">
      <!-- Logo -->
      <div class="login-logo">
        <img src="../images/logo.svg" alt="Mac Applic Logo" width="72" height="72">
        <h1>Mac Applic</h1>
        <p>International School — Admin Portal</p>
      </div>

      <!-- Alert box -->
      <div class="alert" id="loginAlert" role="alert" aria-live="polite"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">
            <span class="field-icon">👤</span> Username
          </label>
          <input
            id="username"
            type="text"
            name="username"
            placeholder="admin"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">
            <span class="field-icon">🔒</span> Password
          </label>
          <div class="pw-wrap">
            <input
              id="password"
              type="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >
            <button type="button" class="pw-toggle" aria-label="Show password" id="pwToggle">👁️</button>
          </div>
        </div>

        <div class="login-meta">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe"> Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span id="loginBtnText">Sign In</span>
          <span id="loginSpinner" class="spinner" style="display:none"></span>
        </button>
      </form>

      <div class="login-footer">
        <a href="/">← Back to School Website</a>
      </div>
    </div>

    <!-- Decorative side panel -->
    <div class="login-side">
      <div class="login-side-content">
        <h2>Admin Dashboard</h2>
        <p>Manage messages, staff, and school communications all in one place.</p>
        <ul>
          <li>📬 View contact messages</li>
          <li>💬 Live chat with visitors</li>
          <li>👩‍🏫 Manage teacher profiles</li>
          <li>📊 School analytics</li>
        </ul>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
